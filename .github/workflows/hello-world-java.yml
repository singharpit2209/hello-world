name: hello-world-java

on:
  push:
    paths:
      - "hello-world-java/**"
      - ".github/workflows/hello-world-java.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Lambda after build
        required: false
        type: boolean
        default: false
      environment:
        description: Target environment
        required: false
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: singharpit2209/shared-workflows/.github/workflows/build-java.yml@main
    with:
      working_directory: hello-world-java

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    uses: singharpit2209/shared-workflows/.github/workflows/deploy-lambda.yml@v0.3.1
    with:
      app_name: hello-world
      component: java
      environment: ${{ inputs.environment }}
      artifact_version: ${{ needs.build.outputs.artifact_version }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      artifact_type: ${{ needs.build.outputs.artifact_type }}
      build_artifact_name: java-lambda-${{ needs.build.outputs.artifact_version }}
    secrets: inherit
